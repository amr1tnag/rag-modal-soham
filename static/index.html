<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local RAG · Ollama</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --ink: #16171a; --muted: #6b7280;
    --line: #e4e4e7; --accent: #2563eb; --accent-ink: #fff;
    --bubble-user: #2563eb; --bubble-bot: #f0f0f2; --ok: #16a34a; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1012; --panel: #17181c; --ink: #e8e8ea; --muted: #9298a3;
      --line: #2a2c33; --bubble-bot: #22242a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 300px 1fr; height: 100vh;
  }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; height: auto; } }

  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 0 0 8px; }
  .status { font-size: 12.5px; color: var(--muted); display: flex;
            align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }

  .drop {
    border: 1.5px dashed var(--line); border-radius: 10px; padding: 22px 14px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); }
  input[type=file] { display: none; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li { display: flex; align-items: center; gap: 8px; font-size: 13px;
       background: var(--bubble-bot); border-radius: 7px; padding: 7px 10px; }
  li span.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { color: var(--muted); }
  li button { background: none; border: 0; color: var(--muted); cursor: pointer;
              font-size: 15px; line-height: 1; padding: 0 2px; }
  li button:hover { color: var(--bad); }
  .empty { font-size: 13px; color: var(--muted); }

  .link { background: none; border: 0; color: var(--muted); font-size: 12.5px;
          cursor: pointer; padding: 0; text-align: left; text-decoration: underline; }
  .link:hover { color: var(--bad); }

  main { display: flex; flex-direction: column; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 26px; display: flex;
          flex-direction: column; gap: 16px; }
  .msg { max-width: 720px; padding: 11px 15px; border-radius: 13px;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--bubble-user); color: #fff;
          border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: var(--bubble-bot);
          border-bottom-left-radius: 4px; }
  .cites { align-self: flex-start; max-width: 720px; font-size: 12px;
           color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .cite { background: var(--panel); border: 1px solid var(--line);
          border-radius: 999px; padding: 2px 9px; }
  .hint { margin: auto; text-align: center; color: var(--muted); font-size: 14px; }

  form { display: flex; gap: 10px; padding: 16px 26px 22px;
         border-top: 1px solid var(--line); background: var(--panel); }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send { background: var(--accent); color: var(--accent-ink); border: 0;
                border-radius: 10px; padding: 0 20px; font-weight: 600;
                cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<aside>
  <div>
    <h1>Local RAG</h1>
    <div class="status"><i class="dot" id="dot"></i><span id="statusText">checking…</span></div>
  </div>

  <div>
    <h2>Add documents</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" multiple accept=".pdf,.txt,.md" />
      Drop PDF / TXT / MD here<br />or click to browse
    </label>
  </div>

  <div>
    <h2>Indexed</h2>
    <ul id="sources"></ul>
    <p class="empty" id="noSources">Nothing indexed yet.</p>
  </div>

  <button class="link" id="reset">Clear all documents</button>
</aside>

<main>
  <div id="chat"><p class="hint">Upload a document, then ask a question about it.</p></div>
  <form id="form">
    <textarea id="q" rows="1" placeholder="Ask about your documents…"></textarea>
    <button class="send" id="send" type="submit">Ask</button>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat");

function bubble(cls, text = "") {
  $("chat").querySelector(".hint")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function refreshHealth() {
  try {
    const h = await (await fetch("/api/health")).json();
    const up = h.ollama === "up";
    const missing = up && !(h.chat_model_ready && h.embed_model_ready);
    $("dot").className = "dot " + (up && !missing ? "ok" : "bad");
    $("statusText").textContent = !up
      ? "Ollama not reachable"
      : missing
      ? "Pull the models (see README)"
      : `${h.chat_model} · ${h.chunks} chunks`;
  } catch {
    $("dot").className = "dot bad";
    $("statusText").textContent = "server unreachable";
  }
}

async function refreshSources() {
  const { sources } = await (await fetch("/api/sources")).json();
  const ul = $("sources");
  ul.innerHTML = "";
  $("noSources").style.display = sources.length ? "none" : "block";
  for (const s of sources) {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = s.source;
    const n = document.createElement("small");
    n.textContent = s.chunks;
    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "Remove";
    del.onclick = async () => {
      await fetch("/api/sources/" + encodeURIComponent(s.source), { method: "DELETE" });
      refreshSources(); refreshHealth();
    };
    li.append(name, n, del);
    ul.appendChild(li);
  }
}

async function uploadFiles(files) {
  for (const f of files) {
    const note = bubble("bot", `Indexing ${f.name}…`);
    const body = new FormData();
    body.append("file", f);
    try {
      const res = await fetch("/api/upload", { method: "POST", body });
      const data = await res.json();
      note.textContent = res.ok
        ? `Indexed ${data.source} — ${data.chunks} chunks.`
        : `Could not index ${f.name}: ${data.detail}`;
    } catch (e) {
      note.textContent = `Could not index ${f.name}: ${e}`;
    }
  }
  refreshSources(); refreshHealth();
}

$("file").onchange = (e) => { uploadFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));

$("reset").onclick = async () => {
  if (!confirm("Remove every indexed document?")) return;
  await fetch("/api/reset", { method: "POST" });
  refreshSources(); refreshHealth();
};

const box = $("q");
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = box.scrollHeight + "px";
});
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const question = box.value.trim();
  if (!question) return;

  bubble("user", question);
  box.value = ""; box.style.height = "auto";
  $("send").disabled = true;

  const answer = bubble("bot", "");
  let cites = null;

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      answer.textContent = (await res.json()).detail ?? "Request failed.";
    } else {
      // Stream NDJSON: one JSON object per line.
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const ev = JSON.parse(line);
          if (ev.type === "token") answer.textContent += ev.text;
          else if (ev.type === "error") answer.textContent += `\n[error] ${ev.error}`;
          else if (ev.type === "sources" && ev.sources.length) {
            cites = document.createElement("div");
            cites.className = "cites";
            const seen = new Set();
            for (const s of ev.sources) {
              if (seen.has(s.source)) continue;
              seen.add(s.source);
              const tag = document.createElement("span");
              tag.className = "cite";
              tag.textContent = `${s.source} · ${s.score}`;
              cites.appendChild(tag);
            }
            chat.appendChild(cites);
          }
          chat.scrollTop = chat.scrollHeight;
        }
      }
      if (cites) chat.appendChild(cites); // keep citations below the answer
    }
  } catch (err) {
    answer.textContent = "Request failed: " + err;
  } finally {
    $("send").disabled = false;
    box.focus();
    chat.scrollTop = chat.scrollHeight;
  }
};

refreshHealth();
refreshSources();
setInterval(refreshHealth, 15000);
</script>
</body>
</html>
