<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local RAG · Ollama</title>
<style>
  :root {
    --bg: #fbfbfc;      --panel: #fff;      --raise: #fff;
    --ink: #17181b;     --muted: #6b7280;   --faint: #9ca3af;
    --line: #e6e6e9;    --line-soft: #f0f0f2;
    --accent: #2f6df6;  --accent-soft: #eef3ff; --accent-ink: #fff;
    --bot: #f4f4f6;     --ok: #16a34a;      --bad: #dc2626;
    --shadow: 0 1px 2px rgba(16,17,20,.05), 0 8px 24px rgba(16,17,20,.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e11;    --panel: #141519;   --raise: #1a1c21;
      --ink: #eceef2;   --muted: #9aa1ad;   --faint: #6c7481;
      --line: #26282f;  --line-soft: #1e2026;
      --accent: #5b8dff; --accent-soft: #182234;
      --bot: #1c1e24;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 288px 1fr; height: 100dvh; overflow: hidden;
  }

  /* ─────────── sidebar ─────────── */
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(140deg, var(--accent), #8b5cf6);
    display: grid; place-items: center; color: #fff; font-size: 15px;
  }
  .brand h1 { font-size: 15px; margin: 0; font-weight: 640; letter-spacing: -.01em; }
  .brand p { margin: 1px 0 0; font-size: 11.5px; color: var(--faint); }

  .status {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: var(--muted); background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok  { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent); }

  h2 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 0 0 9px; font-weight: 600;
  }

  .drop {
    display: block; border: 1.5px dashed var(--line); border-radius: 11px;
    padding: 20px 12px; text-align: center; color: var(--muted);
    font-size: 12.5px; cursor: pointer; transition: .16s;
  }
  .drop:hover, .drop.over {
    border-color: var(--accent); color: var(--accent); background: var(--accent-soft);
  }
  .drop b { display: block; color: var(--ink); font-size: 13px; font-weight: 560; margin-bottom: 2px; }
  .drop.over b { color: var(--accent); }
  input[type=file] { display: none; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  li {
    display: flex; align-items: center; gap: 9px; font-size: 12.5px;
    background: var(--bg); border: 1px solid var(--line-soft);
    border-radius: 9px; padding: 8px 10px; transition: border-color .15s;
  }
  li:hover { border-color: var(--line); }
  .doc-ico { color: var(--faint); flex: none; font-size: 13px; }
  li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  li .x {
    background: none; border: 0; color: var(--faint); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 1px; opacity: 0; transition: .15s;
  }
  li:hover .x { opacity: 1; }
  li .x:hover { color: var(--bad); }
  .empty { font-size: 12.5px; color: var(--faint); margin: 0; }

  .foot { margin-top: auto; display: grid; gap: 2px; }
  .link {
    background: none; border: 0; color: var(--muted); font-size: 12.5px;
    cursor: pointer; padding: 7px 8px; text-align: left; border-radius: 7px;
    transition: .15s; font-family: inherit;
  }
  .link:hover { background: var(--bg); color: var(--ink); }
  .link.danger:hover { color: var(--bad); }

  /* ─────────── chat ─────────── */
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 28px 24px 8px; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }

  .turn { display: flex; flex-direction: column; margin-bottom: 20px; }
  .turn.me { align-items: flex-end; }

  .msg { max-width: 96%; padding: 11px 15px; border-radius: var(--radius); overflow-wrap: anywhere; }
  .me .msg {
    background: var(--accent); color: #fff; border-bottom-right-radius: 5px;
    white-space: pre-wrap; box-shadow: var(--shadow);
  }
  .bot .msg { background: var(--bot); border-bottom-left-radius: 5px; }
  .bot .msg.note { background: none; padding: 6px 0; color: var(--muted); font-size: 13.5px; }

  /* rendered markdown */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child  { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { display: list-item; background: none; border: 0; padding: 2px 0; font-size: inherit; }
  .md li::marker { color: var(--faint); }
  .md h1, .md h2, .md h3 {
    font-size: 15px; font-weight: 640; margin: 16px 0 7px;
    text-transform: none; letter-spacing: normal; color: var(--ink);
  }
  .md code {
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 5px; font: 13px ui-monospace, "SF Mono", Consolas, monospace;
  }
  .md pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 13px; overflow-x: auto; margin: 0 0 10px;
  }
  .md pre code { background: none; border: 0; padding: 0; }
  .md strong { font-weight: 640; }
  .md a { color: var(--accent); }

  .caret {
    display: inline-block; width: 7px; height: 15px; background: var(--accent);
    border-radius: 1px; vertical-align: -2px; margin-left: 2px;
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .thinking { display: flex; gap: 4px; padding: 4px 2px; }
  .thinking i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--faint);
    animation: bounce 1.3s ease-in-out infinite;
  }
  .thinking i:nth-child(2) { animation-delay: .16s; }
  .thinking i:nth-child(3) { animation-delay: .32s; }
  @keyframes bounce { 0%,60%,100% { opacity: .3; transform: translateY(0); }
                      30% { opacity: 1; transform: translateY(-3px); } }

  .tools { display: flex; gap: 5px; margin-top: 7px; opacity: 0; transition: opacity .15s; }
  .turn:hover .tools, .tools:focus-within { opacity: 1; }
  .tool {
    background: none; border: 1px solid transparent; border-radius: 7px;
    color: var(--faint); font-size: 11.5px; padding: 3px 8px; cursor: pointer;
    font-family: inherit; transition: .15s;
  }
  .tool:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }

  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .cite {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px 3px 9px; font-size: 11.5px; color: var(--muted);
    cursor: pointer; font-family: inherit; transition: .15s;
  }
  .cite:hover { border-color: var(--accent); color: var(--accent); }
  .cite[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .cite .bar { width: 22px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; flex: none; }
  .cite .bar i { display: block; height: 100%; background: var(--accent); }
  .excerpt {
    margin-top: 9px; font-size: 13px; line-height: 1.6; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 11px 14px; white-space: pre-wrap; color: var(--muted);
  }
  .excerpt b { display: block; color: var(--ink); font-size: 11.5px; margin-bottom: 6px;
               text-transform: uppercase; letter-spacing: .05em; }

  /* ─────────── welcome ─────────── */
  .welcome { margin: auto; text-align: center; padding: 40px 20px; max-width: 460px; }
  .welcome h3 { font-size: 19px; margin: 0 0 7px; font-weight: 620; letter-spacing: -.015em; }
  .welcome p { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; font-size: 12.5px; color: var(--muted); cursor: pointer;
    font-family: inherit; transition: .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  /* ─────────── composer ─────────── */
  .composer { padding: 12px 24px 20px; }
  form {
    max-width: 760px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end;
    background: var(--raise); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 8px 8px 6px; box-shadow: var(--shadow); transition: border-color .15s;
  }
  form:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; background: none;
    border: 0; outline: none; padding: 8px 10px; max-height: 180px; line-height: 1.55;
  }
  textarea::placeholder { color: var(--faint); }
  .send {
    width: 34px; height: 34px; flex: none; border: 0; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
    display: grid; place-items: center; transition: .15s;
  }
  .send:disabled { opacity: .35; cursor: default; }
  .send:not(:disabled):hover { filter: brightness(1.08); }
  .send.stop { background: var(--bad); }
  .hint-row {
    max-width: 760px; margin: 7px auto 0; font-size: 11px; color: var(--faint);
    text-align: center;
  }
  kbd {
    font: 10.5px ui-monospace, monospace; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted);
  }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(70px);
    background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 9px 16px;
    border-radius: 9px; opacity: 0; transition: .25s; pointer-events: none; z-index: 9;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  #chat::-webkit-scrollbar, aside::-webkit-scrollbar { width: 9px; }
  #chat::-webkit-scrollbar-thumb, aside::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 9px; border: 3px solid var(--bg);
  }

  .burger { display: none; }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    aside {
      position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 20;
      transform: translateX(-100%); transition: transform .22s; box-shadow: var(--shadow);
    }
    aside.open { transform: none; }
    .burger {
      display: grid; place-items: center; position: fixed; top: 12px; left: 12px;
      z-index: 21; width: 36px; height: 36px; border-radius: 9px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    }
    #chat { padding-top: 60px; }
    .composer { padding: 10px 14px 14px; }
  }
</style>
</head>
<body>
<button class="burger" id="burger" aria-label="Toggle sidebar">☰</button>

<aside id="side">
  <div class="brand">
    <div class="mark">◈</div>
    <div><h1>Local RAG</h1><p>Private · runs on your machine</p></div>
  </div>

  <div class="status"><i class="dot" id="dot"></i><span id="statusText">checking…</span></div>

  <div>
    <h2>Documents</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" multiple accept=".pdf,.txt,.md" />
      <b>Add files</b>
      Drop PDF, TXT or MD — or click
    </label>
  </div>

  <div>
    <h2>Indexed</h2>
    <ul id="sources"></ul>
    <p class="empty" id="noSources">Nothing indexed yet.</p>
  </div>

  <div class="foot">
    <button class="link" id="newChat">↻ New conversation</button>
    <button class="link danger" id="reset">Clear all documents</button>
  </div>
</aside>

<main>
  <div id="chat"><div class="inner" id="inner"></div></div>
  <div class="composer">
    <form id="form">
      <textarea id="q" rows="1" placeholder="Ask about your documents…"></textarea>
      <button class="send" id="send" type="submit" title="Send" aria-label="Send">➤</button>
    </form>
    <div class="hint-row"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat"), inner = $("inner");
let history = [], busy = null;

/* ── tiny markdown renderer ──────────────────────────────────────────────
   Models reply in markdown, so raw asterisks and dashes would otherwise
   show through. Everything is HTML-escaped first, then a fixed set of
   inline and block rules is applied — no innerHTML ever sees model or
   document text unescaped. */
const esc = (s) => s.replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function md(src) {
  const code = [];
  // Park fenced blocks so the inline rules can't touch their contents. The
  // marker is built from NULs, which esc() can never emit, so ordinary
  // prose — "step 3 of 5" — is never mistaken for a placeholder.
  let t = esc(src).replace(/```\w*\n?([\s\S]*?)```/g, (_, body) =>
    `\u0000${code.push(`<pre><code>${body.replace(/\n$/, "")}</code></pre>`) - 1}\u0000`);

  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  for (const raw of t.split("\n")) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    if (line.startsWith("\u0000")) { closeList(); out.push(line); continue; }

    const head = line.match(/^(#{1,6})\s+(.*)$/);
    if (head) { closeList(); out.push(`<h3>${head[2]}</h3>`); continue; }

    const bullet = line.match(/^[-*•]\s+(.*)$/);
    const number = line.match(/^\d+[.)]\s+(.*)$/);
    if (bullet || number) {
      const want = bullet ? "ul" : "ol";
      if (list !== want) { closeList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${(bullet || number)[1]}</li>`);
      continue;
    }
    closeList();
    // A parked code block stands alone; it must not be wrapped in <p>.
    out.push(/^\u0000\d+\u0000$/.test(line) ? line : `<p>${line}</p>`);
  }
  closeList();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => code[i]);
}

/* ── shell ─────────────────────────────────────────────────────────── */
function toast(text) {
  const el = $("toast");
  el.textContent = text; el.classList.add("on");
  clearTimeout(el.t); el.t = setTimeout(() => el.classList.remove("on"), 2200);
}
const atBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
const toBottom = () => (chat.scrollTop = chat.scrollHeight);

function welcome(text) {
  inner.innerHTML = "";
  const w = document.createElement("div");
  w.className = "welcome";
  w.innerHTML = `<h3>Ask your documents</h3><p>${esc(text)}</p>`;
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const s of ["Summarise this document", "What are the key points?", "List the main dates"]) {
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button"; c.textContent = s;
    c.onclick = () => { box.value = s; box.focus(); $("form").requestSubmit(); };
    chips.appendChild(c);
  }
  w.appendChild(chips);
  inner.appendChild(w);
}

function turn(kind) {
  inner.querySelector(".welcome")?.remove();
  const t = document.createElement("div");
  t.className = "turn " + kind;
  inner.appendChild(t);
  toBottom();
  return t;
}

function bubble(kind, text = "", cls = "") {
  const t = turn(kind);
  const b = document.createElement("div");
  b.className = "msg " + cls;
  b.textContent = text;
  t.appendChild(b);
  toBottom();
  return b;
}

/* ── sidebar data ──────────────────────────────────────────────────── */
async function refreshHealth() {
  try {
    const h = await (await fetch("/api/health")).json();
    const up = h.ollama === "up";
    const missing = up && !(h.chat_model_ready && h.embed_model_ready);
    $("dot").className = "dot " + (up && !missing ? "ok" : "bad");
    $("statusText").textContent = !up ? "Ollama not reachable"
      : missing ? "Run: ollama pull " + (h.embed_model_ready ? h.chat_model : h.embed_model)
      : `${h.chat_model} · ${h.chunks} chunk${h.chunks === 1 ? "" : "s"}`;
  } catch {
    $("dot").className = "dot bad";
    $("statusText").textContent = "server unreachable";
  }
}

async function refreshSources() {
  const { sources } = await (await fetch("/api/sources")).json();
  const ul = $("sources");
  ul.innerHTML = "";
  $("noSources").style.display = sources.length ? "none" : "block";
  if (!sources.length && !inner.querySelector(".turn"))
    welcome("Add a PDF or text file, then ask anything about it.");
  else if (sources.length && !inner.querySelector(".turn"))
    welcome(`${sources.length} document${sources.length === 1 ? "" : "s"} ready.`);

  for (const s of sources) {
    const li = document.createElement("li");
    const ico = document.createElement("span"); ico.className = "doc-ico"; ico.textContent = "▤";
    const name = document.createElement("span"); name.className = "name";
    name.textContent = s.source; name.title = s.source;
    const n = document.createElement("span"); n.className = "n"; n.textContent = s.chunks;
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "×"; x.title = "Remove " + s.source;
    x.onclick = async () => {
      await fetch("/api/sources/" + encodeURIComponent(s.source), { method: "DELETE" });
      toast("Removed " + s.source);
      refreshSources(); refreshHealth();
    };
    li.append(ico, name, n, x);
    ul.appendChild(li);
  }
}

async function uploadFiles(files) {
  for (const f of files) {
    const note = bubble("bot", `Indexing ${f.name}…`, "note");
    const body = new FormData();
    body.append("file", f);
    try {
      const res = await fetch("/api/upload", { method: "POST", body });
      const data = await res.json();
      note.textContent = res.ok
        ? `✓ Indexed ${data.source} — ${data.chunks} chunk${data.chunks === 1 ? "" : "s"}`
        : `✕ ${f.name}: ${data.detail}`;
    } catch (e) {
      note.textContent = `✕ ${f.name}: ${e}`;
    }
  }
  refreshSources(); refreshHealth();
}

$("file").onchange = (e) => { uploadFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));
// Dropping anywhere else shouldn't make the browser navigate to the file.
["dragover", "drop"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));

$("reset").onclick = async () => {
  if (!confirm("Remove every indexed document?")) return;
  await fetch("/api/reset", { method: "POST" });
  history = []; inner.innerHTML = "";
  toast("All documents cleared");
  refreshSources(); refreshHealth();
};

$("newChat").onclick = () => {
  history = []; inner.innerHTML = "";
  refreshSources();
  box.focus();
};

$("burger").onclick = () => $("side").classList.toggle("open");

/* ── composer ──────────────────────────────────────────────────────── */
const box = $("q");
const grow = () => { box.style.height = "auto"; box.style.height = box.scrollHeight + "px"; };
box.addEventListener("input", grow);
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

$("send").onclick = (e) => {
  if (busy) { e.preventDefault(); busy.abort(); }   // second click stops generation
};

$("form").onsubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  const question = box.value.trim();
  if (!question) return;

  bubble("me", question);
  box.value = ""; grow();

  const send = $("send");
  send.disabled = false; send.classList.add("stop");
  send.textContent = "■"; send.title = "Stop generating";

  const t = turn("bot");
  const msg = document.createElement("div");
  msg.className = "msg";
  msg.innerHTML = '<div class="thinking"><i></i><i></i><i></i></div>';
  t.appendChild(msg);

  let raw = "", cites = null, first = true;
  busy = new AbortController();

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history }),
      signal: busy.signal,
    });

    if (!res.ok) {
      msg.className = "msg note";
      msg.textContent = "✕ " + ((await res.json()).detail ?? "Request failed.");
    } else {
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const ev = JSON.parse(line);

          if (ev.type === "token") {
            if (first) { msg.innerHTML = ""; msg.className = "msg md"; first = false; }
            raw += ev.text;
            const stick = atBottom();
            msg.innerHTML = md(raw) + '<span class="caret"></span>';
            if (stick) toBottom();

          } else if (ev.type === "error") {
            raw += `\n\n_[error: ${ev.error}]_`;

          } else if (ev.type === "sources" && ev.sources.length) {
            cites = document.createElement("div");
            cites.className = "cites";
            for (const s of ev.sources) {
              const tag = document.createElement("button");
              tag.className = "cite"; tag.type = "button";
              tag.setAttribute("aria-expanded", "false");
              tag.title = "Show the text this came from";
              const bar = document.createElement("span");
              bar.className = "bar";
              const fill = document.createElement("i");
              // Similarity is roughly 0.3–0.9 in practice; stretch that to
              // fill the bar so differences between chunks stay visible.
              fill.style.width =
                Math.max(6, Math.min(100, (s.score - 0.25) * 160)) + "%";
              bar.appendChild(fill);
              tag.append(document.createTextNode(s.source + " "), bar);
              tag.onclick = () => {
                if (tag.box) {
                  tag.box.remove(); tag.box = null;
                  tag.setAttribute("aria-expanded", "false");
                  return;
                }
                const ex = document.createElement("div");
                ex.className = "excerpt";
                const label = document.createElement("b");
                label.textContent = `${s.source} · similarity ${s.score}`;
                ex.append(label, document.createTextNode(s.text));
                t.appendChild(ex);
                tag.box = ex;
                tag.setAttribute("aria-expanded", "true");
                ex.scrollIntoView({ block: "nearest" });
              };
              cites.appendChild(tag);
            }
          }
        }
      }
    }
  } catch (err) {
    if (err.name === "AbortError") raw += raw ? "\n\n_[stopped]_" : "";
    else { msg.className = "msg note"; msg.textContent = "✕ " + err; }
  } finally {
    if (raw) {
      msg.className = "msg md";
      msg.innerHTML = md(raw);
      history.push({ role: "user", content: question });
      history.push({ role: "assistant", content: raw });

      const tools = document.createElement("div");
      tools.className = "tools";
      const copy = document.createElement("button");
      copy.className = "tool"; copy.type = "button"; copy.textContent = "Copy";
      copy.onclick = async () => {
        await navigator.clipboard.writeText(raw);
        toast("Copied to clipboard");
      };
      const again = document.createElement("button");
      again.className = "tool"; again.type = "button"; again.textContent = "Ask again";
      again.onclick = () => {
        // Drop this exchange so the retry isn't answered from its own output.
        history = history.slice(0, -2);
        t.remove();
        t.previousElementSibling?.remove();
        box.value = question; grow(); $("form").requestSubmit();
      };
      tools.append(copy, again);
      t.appendChild(tools);
    }
    if (cites) t.appendChild(cites);

    busy = null;
    send.disabled = false; send.classList.remove("stop");
    send.textContent = "➤"; send.title = "Send";
    box.focus(); toBottom();
  }
};

refreshHealth();
refreshSources();
setInterval(refreshHealth, 15000);
</script>
</body>
</html>
